name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected and the full output, with any private data removed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The commands you ran and the relevant parts of eval.toml.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `slmeval doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: exit-code
    attributes:
      label: Exit code
      options:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
        - Other, or a traceback
        - Not applicable
