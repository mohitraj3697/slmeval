#  The offline suite, on both platforms it has to be identical on.
#
#  Determinism bugs in a harness like this are nearly all platform bugs: a hash
#  that iterates a dict, a path separator inside a cassette key, a CRLF
#  checkout, a console that cannot encode a box-drawing character. None of them
#  reproduce on the machine they were written on, which is why the matrix is
#  Windows *and* Linux rather than one of them.
#
#  Nothing here needs a GPU, a model server or an API key. If a job in this
#  file ever needs one, the test that made it necessary belongs behind
#  `-m live` instead.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  # The developer-loop target is under 30 seconds; a cold CI runner is slower
  # than a laptop, so the gate here only has to catch a regression in kind -
  # someone reintroducing a real sleep, a retry with a real backoff, or a test
  # that opens a socket.
  SUITE_BUDGET_S: "120"

jobs:
  offline:
    name: offline suite (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Type-check
        run: python -m mypy src

      - name: Offline suite, within its time budget
        shell: bash
        run: |
          start=$(date +%s)
          python -m pytest --durations=10
          elapsed=$(( $(date +%s) - start ))
          echo "offline suite: ${elapsed}s (budget ${SUITE_BUDGET_S}s)"
          if [ "$elapsed" -gt "$SUITE_BUDGET_S" ]; then
            echo "::error::the offline suite took ${elapsed}s, over the ${SUITE_BUDGET_S}s budget."
            echo "A suite people stop running protects nothing - see the slowest tests above."
            exit 1
          fi

  # The one job that installs a model framework. The core must stay installable
  # in seconds without one, so `langgraph` is an extra and the adapter's tests
  # skip in every other job here - which means that without this job they would
  # never run anywhere, and a skipped test reads as a passing one.
  langgraph:
    name: langgraph adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install, with the extra
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,langgraph]"

      - name: The adapter, and the example under both adapters
        run: python -m pytest tests/test_langgraph_adapter.py -v

      - name: Nothing was skipped
        shell: bash
        run: |
          # A green job that skipped the only two tests it exists to run would
          # be worse than no job: it would read as coverage we do not have.
          python -m pytest tests/test_langgraph_adapter.py -q -rs 2>&1 | tee out.txt
          if grep -q "skipped" out.txt; then
            echo "::error::a langgraph test skipped in the job that installs langgraph."
            exit 1
          fi

  install-smoke:
    name: install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `pytest` runs against the working tree and so proves nothing about what
      # `pip install slmeval` ships. This builds the wheel, installs it into a
      # throwaway venv with nothing else in it, and runs init / validate /
      # doctor / record / run / report as a new user would.
      - name: Build and use the wheel
        run: python scripts/install_smoke.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
