# Publish to PyPI on a tag, with Trusted Publishing.
#
# No long-lived token in this repository's secrets. PyPI mints a short-lived
# credential for this exact workflow in this exact repository, via OIDC, which
# is why the publish job asks for `id-token: write` and has no `password:`. A
# token in secrets is a credential that can be exfiltrated by any workflow that
# can read secrets, and for a measurement tool people are asked to install into
# their CI, that is the wrong trade.
#
# It also refuses to publish a tag that disagrees with the package: a `v0.1.1`
# tag on a tree whose `__version__` still says `0.1.0` would put a wheel on
# PyPI that no git tag describes.
#
# Setup, once, before the first tag: on PyPI, add a trusted publisher for this
# repository with workflow `release.yml` and environment `pypi`.
#
#     git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and check, but do not publish.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # A tag is not a release until the thing it points at actually works. The
  # offline suite and the install smoke both run again here rather than
  # trusting that they ran on the commit: a tag can point anywhere.
  verify:
    name: verify the tagged tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: The tag and the package agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import slmeval; print(slmeval.__version__)")
          echo "tag $tagged, package $packaged"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $packaged."
            echo "Publishing would put a wheel on PyPI that no git tag describes."
            exit 1
          fi

      - name: Offline suite
        run: python -m pytest

      - name: The wheel installs and produces a scorecard
        run: python scripts/install_smoke.py

  build:
    name: build the distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry-run
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The whole point: PyPI mints a short-lived credential for this workflow
      # over OIDC, so there is no token in this repository to leak.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
