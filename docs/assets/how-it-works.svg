<svg xmlns="http://www.w3.org/2000/svg" width="860" height="326" viewBox="0 0 860 326" role="img">
<title>How a benchmark runs</title>
<desc>slmeval record runs your agent's real tools once and stores every response. slmeval run then replays those responses for each candidate model, checks the results and reports them, and slmeval gate turns the report into an exit code.</desc>
<style>
text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 13px; fill: #0b0b0b; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size: 12.5px; }
.title { font-size: 15px; font-weight: 600; }
.sub { fill: #52514e; }
.muted { fill: #6f6d68; font-size: 12px; }
.card { fill: #fcfcfb; stroke: #e1e0d9; }
.grid { stroke: #e1e0d9; stroke-width: 1; }
.axis { stroke: #c3c2b7; stroke-width: 1; }
.floor { stroke: #52514e; stroke-width: 1.5; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
.s1 { fill: #2a78d6; }
.s2 { fill: #eb6834; }
.line1 { stroke: #2a78d6; stroke-width: 2; stroke-linecap: round; }
.link { stroke: #898781; stroke-width: 2; stroke-linecap: round; }
.good { fill: #0a860a; }
.bad { fill: #d03b3b; }
.on-bad { fill: #ffffff; font-weight: 600; }
.tile { fill: #f4f3ef; }
.box { fill: #f4f3ef; stroke: #c3c2b7; }
.band { fill: #f4f3ef; }
.arrow { stroke: #52514e; stroke-width: 1.5; fill: none; }
.head { fill: #52514e; }
@media (prefers-color-scheme: dark) {
  text { fill: #f0efec; }
  .sub { fill: #c3c2b7; }
  .muted { fill: #a3a199; }
  .card { fill: #1a1a19; stroke: #383835; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .floor { stroke: #c3c2b7; }
  .ring { stroke: #1a1a19; }
  .s1 { fill: #3987e5; }
  .s2 { fill: #d95926; }
  .line1 { stroke: #3987e5; }
  .good { fill: #0ca30c; }
  .on-bad { fill: #ffffff; }
  .tile { fill: #262624; }
  .box { fill: #262624; stroke: #4a4a46; }
  .band { fill: #222220; }
  .arrow { stroke: #c3c2b7; }
  .head { fill: #c3c2b7; }
}
</style>
<rect x="0.5" y="0.5" width="859" height="325" rx="6" class="card"/>
<text x="24" y="32" class="title">How a benchmark runs</text>
<rect x="14" y="48" width="832" height="104" rx="5" class="band"/>
<text x="26" y="68" class="sub">Once</text>
<rect x="14" y="162" width="832" height="150" rx="5" class="band"/>
<text x="26" y="182" class="sub">Every run: offline, no API keys for tools</text>
<rect x="26" y="78" width="190" height="62" rx="5" class="box"/>
<text x="121" y="104" text-anchor="middle">Your agent</text>
<text x="121" y="122" class="muted" text-anchor="middle">with its real tools</text>
<rect x="290" y="78" width="190" height="62" rx="5" class="box"/>
<text x="385" y="104" class="mono" text-anchor="middle">slmeval record</text>
<text x="385" y="122" class="muted" text-anchor="middle">runs the tools once</text>
<rect x="554" y="78" width="190" height="62" rx="5" class="box"/>
<text x="649" y="104" class="mono" text-anchor="middle">cassettes.sqlite</text>
<text x="649" y="122" class="muted" text-anchor="middle">every tool response</text>
<polyline points="216,109 290,109" class="arrow"/>
<polygon points="290,109 283,105 283,113" class="head"/>
<polyline points="480,109 554,109" class="arrow"/>
<polygon points="554,109 547,105 547,113" class="head"/>
<rect x="26" y="200" width="150" height="92" rx="5" class="box"/>
<text x="101" y="223" text-anchor="middle">Candidates</text>
<text x="101" y="241" class="mono" text-anchor="middle">baseline</text>
<text x="101" y="259" class="mono" text-anchor="middle">small model A</text>
<text x="101" y="277" class="mono" text-anchor="middle">small model B</text>
<rect x="226" y="200" width="150" height="92" rx="5" class="box"/>
<text x="301" y="232" class="mono" text-anchor="middle">slmeval run</text>
<text x="301" y="250" class="muted" text-anchor="middle">models x cases</text>
<text x="301" y="268" class="muted" text-anchor="middle">x repeats</text>
<rect x="426" y="200" width="150" height="92" rx="5" class="box"/>
<text x="501" y="223" text-anchor="middle">Checks</text>
<text x="501" y="241" class="muted" text-anchor="middle">assertions</text>
<text x="501" y="259" class="muted" text-anchor="middle">tool calls, path</text>
<text x="501" y="277" class="muted" text-anchor="middle">pass^k, interval</text>
<rect x="626" y="200" width="94" height="92" rx="5" class="box"/>
<text x="673" y="223" text-anchor="middle">Report</text>
<text x="673" y="241" class="muted" text-anchor="middle">table</text>
<text x="673" y="259" class="muted" text-anchor="middle">JSON</text>
<text x="673" y="277" class="muted" text-anchor="middle">JUnit</text>
<rect x="748" y="200" width="86" height="92" rx="5" class="box"/>
<text x="791" y="232" class="mono" text-anchor="middle">slmeval</text>
<text x="791" y="250" class="mono" text-anchor="middle">gate</text>
<text x="791" y="268" class="muted" text-anchor="middle">exit 0 / 1</text>
<polyline points="176,246 226,246" class="arrow"/>
<polygon points="226,246 219,242 219,250" class="head"/>
<polyline points="376,246 426,246" class="arrow"/>
<polygon points="426,246 419,242 419,250" class="head"/>
<polyline points="576,246 626,246" class="arrow"/>
<polygon points="626,246 619,242 619,250" class="head"/>
<polyline points="720,246 748,246" class="arrow"/>
<polygon points="748,246 741,242 741,250" class="head"/>
<polyline points="649,140 649,172 301,172 301,200" class="arrow"/>
<polygon points="301,200 297,193 305,193" class="head"/>
</svg>
