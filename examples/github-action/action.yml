# A composite action that runs a benchmark in replay mode and gates the build.
#
# The one line that decides whether this is adoptable: **replay mode needs no
# GPU and no API keys.** Every tool response comes out of a local SQLite file
# and every model response either comes from the `fake` provider or from an
# endpoint you configured yourself. A standard GitHub runner is enough.
#
# What it does, in order:
#
#   1. installs slmeval into the runner's Python;
#   2. asks `slmeval validate --json` for the *content* hash of the dataset;
#   3. restores the cassette store from `actions/cache`, keyed on that hash;
#   4. runs the matrix in replay mode and gates it;
#   5. posts the scorecard and the gate verdict to the job summary, and - on a
#      pull request - edits one sticky comment rather than adding a new one per
#      push;
#   6. exits with the gate's own exit code, so the three outcomes CI has to
#      tell apart stay apart: 1 is a regression, 3 is infrastructure, 4 is a
#      hole in your recordings.
#
# The cache key is the dataset hash and nothing else. That is deliberate: a
# cassette store recorded against a different dataset is stale, and a workflow
# that keyed on a branch name would restore it anyway and then report every
# uncovered path as a model regression. On a miss the run still completes and
# the gate exits 4 - "not enough recorded ground truth to judge this" - which
# is the truth, and is not the same as a red build.

name: slmeval
description: >-
  Benchmark an agent across models and gate the build. Replay mode, so no GPU
  and no API keys are needed on the runner.
author: slmeval contributors

branding:
  icon: bar-chart-2
  color: purple

inputs:
  working-directory:
    description: The directory holding eval.toml.
    required: false
    default: "."
  config:
    description: Path to eval.toml, if it is not the one in working-directory.
    required: false
    default: ""
  version:
    description: >-
      What to pip install. A version spec ("slmeval==0.1.0"), or "." to install
      the checked-out repository itself.
    required: false
    default: slmeval
  python-version:
    description: Python for the runner. 3.11 is the floor.
    required: false
    default: "3.11"
  cassettes:
    description: >-
      A committed cassette file to use, copied into .slmeval/cassettes.sqlite
      before the run. The reproducible option: a cache can be evicted, a
      committed file cannot.
    required: false
    default: ""
  cache:
    description: Restore and save the cassette store through actions/cache.
    required: false
    default: "true"
  record:
    description: >-
      "never" (default) or "missing". "missing" runs `slmeval record` when no
      cassettes were found - which executes your real tools, so only set it
      when those tools are hermetic or your provider is `fake`.
    required: false
    default: never
  run-args:
    description: Extra arguments for `slmeval run`.
    required: false
    default: ""
  gate-args:
    description: >-
      Extra arguments for `slmeval gate`. Thresholds belong in the [gate]
      section of eval.toml so that CI can call the gate bare and the numbers
      are reviewable in a diff.
    required: false
    default: ""
  comment:
    description: Post the report as a sticky pull-request comment.
    required: false
    default: "true"
  token:
    description: Token used to post the comment. Needs `pull-requests: write`.
    required: false
    default: ${{ github.token }}
  artifact:
    description: Upload the run database, JSON report and JUnit XML.
    required: false
    default: "true"
  artifact-name:
    description: Name for that artifact.
    required: false
    default: slmeval-run

outputs:
  exit-code:
    description: The gate's exit code. 0 pass, 1 gate failed, 3 environment, 4 coverage.
    value: ${{ steps.gate.outputs.exit-code }}
  verdict:
    description: passed | failed | environment | coverage | usage
    value: ${{ steps.gate.outputs.verdict }}
  run-id:
    description: The run id, for `slmeval show` and `slmeval report --run-id`.
    value: ${{ steps.run.outputs.run-id }}
  dataset-hash:
    description: Content hash of the dataset. The cassette cache key.
    value: ${{ steps.validate.outputs.dataset-hash }}
  config-hash:
    description: Content hash of the config. What `gate` refuses to compare across.
    value: ${{ steps.validate.outputs.config-hash }}
  cassettes-restored:
    description: Whether a cassette store was found before the run.
    value: ${{ steps.cassettes.outputs.found }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install slmeval
      shell: bash
      env:
        SLMEVAL_REQUIREMENT: ${{ inputs.version }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$SLMEVAL_REQUIREMENT"
        slmeval --version

    # Before anything is cached or run: does the config even load, and what is
    # the dataset's content hash? Everything downstream keys on that hash, and
    # a config error here is exit 2 - a usage problem, not a regression.
    - name: Validate and read the hashes
      id: validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG_ARG: ${{ inputs.config && format('--config {0}', inputs.config) || '' }}
      run: |
        set -euo pipefail
        slmeval validate --json $CONFIG_ARG > slmeval-validate.json
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, pathlib
        data = json.loads(pathlib.Path("slmeval-validate.json").read_text(encoding="utf-8"))
        for key in ("dataset_hash", "config_hash", "dataset", "cases", "executions"):
            print(f"{key.replace('_', '-')}={data[key]}")
        PY

    - name: Use the committed cassettes
      if: inputs.cassettes != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        mkdir -p .slmeval
        cp "${{ inputs.cassettes }}" .slmeval/cassettes.sqlite
        echo "using committed cassettes from ${{ inputs.cassettes }}"

    # Keyed on the dataset hash alone. `restore-keys` is deliberately absent:
    # a partial-prefix hit would hand the run a store recorded for a different
    # dataset, and a stale cassette reads as a model failure.
    - name: Restore the cassette store
      id: cache
      if: inputs.cache == 'true' && inputs.cassettes == ''
      uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/.slmeval
        key: slmeval-cassettes-${{ runner.os }}-${{ steps.validate.outputs.dataset-hash }}

    - name: Cassette store present?
      id: cassettes
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f .slmeval/cassettes.sqlite ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=slmeval::No cassette store for dataset ${{ steps.validate.outputs.dataset-hash }}. Replay has nothing to serve, so the gate will exit 4 (not enough coverage to judge) rather than report a regression."
        fi

    # Opt-in, and the input's description says why: `record` executes the real
    # tools. On a runner that is only safe when those tools are hermetic, or
    # when the provider is `fake`.
    - name: Record the cassettes
      if: steps.cassettes.outputs.found == 'false' && inputs.record == 'missing'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG_ARG: ${{ inputs.config && format('--config {0}', inputs.config) || '' }}
      run: slmeval record --quiet --ascii $CONFIG_ARG

    - name: Run the matrix in replay mode
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG_ARG: ${{ inputs.config && format('--config {0}', inputs.config) || '' }}
        # Through the environment rather than interpolated into the command
        # line, so an input cannot become shell syntax.
        RUN_ARGS: ${{ inputs.run-args }}
      run: |
        set -euo pipefail
        slmeval run \
          --tool-mode replay \
          --quiet \
          --ascii \
          --json slmeval-report.json \
          $CONFIG_ARG $RUN_ARGS
        slmeval report --format md $CONFIG_ARG > slmeval-report.md
        slmeval report --format junit --out slmeval-junit.xml $CONFIG_ARG
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, pathlib
        data = json.loads(pathlib.Path("slmeval-report.json").read_text(encoding="utf-8"))
        print(f"run-id={data['run']['run_id']}")
        PY

    # The only step allowed to fail, and it reports its own exit code rather
    # than letting the shell abort: 1, 3 and 4 mean three different things to
    # the reviewer and all three have to reach the summary.
    - name: Gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG_ARG: ${{ inputs.config && format('--config {0}', inputs.config) || '' }}
        GATE_ARGS: ${{ inputs.gate-args }}
      run: |
        set +e
        slmeval gate --format md --out slmeval-gate.md --ascii $CONFIG_ARG $GATE_ARGS
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        case "$code" in
          0) verdict=passed ;;
          1) verdict=failed ;;
          2) verdict=usage ;;
          3) verdict=environment ;;
          4) verdict=coverage ;;
          *) verdict=unknown ;;
        esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "gate exited $code ($verdict)"

    - name: Job summary
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        {
          if [ -f slmeval-gate.md ]; then cat slmeval-gate.md; fi
          echo
          if [ -f slmeval-report.md ]; then cat slmeval-report.md; fi
          echo
          echo "<sub>Replayed from cassettes - no GPU and no API keys on this runner."
          echo "dataset \`${{ steps.validate.outputs.dataset-hash }}\` ·"
          echo "config \`${{ steps.validate.outputs.config-hash }}\` ·"
          echo "cassettes restored: ${{ steps.cassettes.outputs.found }}</sub>"
        } >> "$GITHUB_STEP_SUMMARY"

    # One comment, edited in place. A workflow that appended a comment per push
    # turns a three-round review into forty collapsed tables, and the finding
    # nobody scrolls to is a finding the tool did not deliver.
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const dir = '${{ inputs.working-directory }}';
          const marker = '<!-- slmeval-gate -->';
          const read = (name) => {
            const file = path.join(dir, name);
            return fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';
          };
          const gate = read('slmeval-gate.md');
          const report = read('slmeval-report.md');
          if (!gate && !report) {
            core.info('slmeval produced no report to comment.');
            return;
          }
          const body = [
            marker,
            gate,
            '<details><summary>Scorecard</summary>',
            '',
            report,
            '',
            '</details>',
            '',
            '<sub>Replayed from cassettes — no GPU and no API keys. ' +
              'Exit codes: 0 pass · 1 regression · 3 infrastructure · 4 coverage.</sub>',
          ].join('\n');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const existing = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const mine = existing.find((c) => c.body && c.body.includes(marker));
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Upload the run
      if: always() && inputs.artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        if-no-files-found: ignore
        path: |
          ${{ inputs.working-directory }}/slmeval-report.json
          ${{ inputs.working-directory }}/slmeval-report.md
          ${{ inputs.working-directory }}/slmeval-gate.md
          ${{ inputs.working-directory }}/slmeval-junit.xml
          ${{ inputs.working-directory }}/slmeval-validate.json
          ${{ inputs.working-directory }}/.slmeval/runs.sqlite

    # Last, so the summary, the comment and the artifact all exist before the
    # job can go red. Exit 3 and 4 still fail the job - a measurement that did
    # not happen must not read as a pass - but they are labelled, in the
    # annotation and in the comment, as infrastructure rather than regression.
    - name: Report the gate's verdict
      if: always()
      shell: bash
      run: |
        code='${{ steps.gate.outputs.exit-code }}'
        case "${{ steps.gate.outputs.verdict }}" in
          passed)
            echo "::notice title=slmeval::Gate passed."
            ;;
          failed)
            echo "::error title=slmeval: regression::A quality threshold was not met. See the job summary for the candidate, the case and the node."
            ;;
          environment)
            echo "::error title=slmeval: infrastructure, not a regression::A provider was unreachable (exit 3). No model got worse; the measurement did not happen."
            ;;
          coverage)
            echo "::error title=slmeval: coverage, not a regression::Not enough recorded ground truth to judge this run (exit 4). Run 'slmeval record --fill-gaps' and refresh the cassettes."
            ;;
          usage)
            echo "::error title=slmeval: usage error::The gate was misconfigured (exit 2) - no candidate, or no threshold to check."
            ;;
          *)
            echo "::error title=slmeval::Gate exited $code."
            ;;
        esac
        exit "${code:-1}"
