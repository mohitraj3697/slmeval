[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slmeval"
dynamic = ["version"]
description = "Benchmark agent workflows across small language models — locally, deterministically, in your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "slmeval contributors" }]
keywords = [
    "llm",
    "slm",
    "agents",
    "evaluation",
    "benchmark",
    "ollama",
    "langgraph",
    "ci",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# Core stays deliberately small: `pip install slmeval` must finish in seconds and
# must never pull in a model framework. Framework support lives in extras.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-openai>=0.2"]
anthropic = ["anthropic>=0.34"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
slmeval = "slmeval.cli.main:main"

[project.urls]
Homepage = "https://github.com/slmeval/slmeval"
Issues = "https://github.com/slmeval/slmeval/issues"

[tool.hatch.version]
path = "src/slmeval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slmeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite is the offline suite: no GPU, no API keys, no network, and
# no spend. Live provider checks are opt-in with `pytest -m live`.
addopts = "-q -m 'not live'"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits a real provider; excluded from the default offline suite",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A JSONL case is one physical line by definition; wrapping it breaks the file.
"src/slmeval/config/templates.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
